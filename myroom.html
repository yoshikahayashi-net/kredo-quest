<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>抱月クレドクエスト｜マイルーム</title><style>body{margin:0;background:#e8f7fc;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP","Yu Gothic",sans-serif}.app{width:min(100%,460px);margin:auto;min-height:100vh;background:#fff}.top{height:54px;background:#168bcB;color:#fff;display:flex;align-items:center;padding:0 10px;gap:8px}.top button{border:0;background:#ffffff20;color:#fff;border-radius:9px;width:34px;height:34px;font-size:17px}.top strong{font-size:15px}.wrap{padding:8px 8px 18px}.refcard{position:relative;width:100%;border-radius:16px;overflow:hidden;border:1px solid #cfe3ed;background:#fff}.refimg{width:100%;aspect-ratio:600/487;background-image:url('reference_ui.jpg?v=42');background-repeat:no-repeat;background-position:left top;background-size:164% auto}.roomimg{aspect-ratio:384/487;background-position:right top;background-size:256% auto}.hot{position:absolute;border:0;background:transparent;cursor:pointer}.hot:focus{outline:2px solid #3aaef0}.panel{display:none;margin-top:8px;background:#fff;border:1px solid #cfe3ed;border-radius:14px;padding:10px}.panel.open{display:block}.panelhead{font-size:11px;font-weight:900;color:#173244}.choices{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}.choice{border:1px solid #cfe3ed;background:#f7fcfe;border-radius:10px;padding:8px 10px;font-size:9px;font-weight:900;color:#31556a}.choice.sel{border-color:#168bcB;background:#eaf8fd;color:#0d6da6}.save{width:100%;height:42px;margin-top:9px;border:0;border-radius:11px;background:#168bcB;color:#fff;font-weight:900}.note{font-size:8px;color:#6b8090;text-align:center;padding-top:7px}</style></head><body><div class="app"><div class="top"><button onclick="location.href='index.html?v=42'">‹</button><strong>マイルーム</strong></div><div class="wrap"><div class="refcard"><div class="refimg roomimg" id="ref"></div>
<button class="hot" style="left:4%;top:69%;width:17%;height:18%" aria-label="家具" onclick="openRoom('家具',['デスク','チェア','植物','本棚'])"></button>
<button class="hot" style="left:20%;top:69%;width:17%;height:18%" aria-label="壁紙" onclick="openRoom('壁紙',['ベーシック','森・自然','工房','未来・テック','クレドスペシャル'])"></button>
<button class="hot" style="left:37%;top:69%;width:17%;height:18%" aria-label="床" onclick="openRoom('床',['木床','タイル','カーペット','クレド床'])"></button>
<button class="hot" style="left:53%;top:69%;width:17%;height:18%" aria-label="アイテム" onclick="openRoom('アイテム',['観葉植物','本','ポスター','クレドアイテム'])"></button>
<button class="hot" style="left:69%;top:69%;width:17%;height:18%" aria-label="BGM" onclick="openRoom('BGM',['BGMは準備中'])"></button>
<button class="hot" style="left:79%;top:4%;width:17%;height:12%" aria-label="部屋を編集" onclick="openRoom('部屋を編集',['テーマ変更','家具変更','アイテム変更'])"></button>
</div><div class="panel" id="panel"><div class="panelhead" id="panelHead"></div><div class="choices" id="choices"></div><button class="save" onclick="saveRoom()">保存する</button></div><div class="note">この画面の見た目は、指定された完成イメージをそのまま使用しています。操作領域だけを重ねています。</div></div></div>
<script>
const account=JSON.parse(localStorage.getItem('kredoAccount')||'null');const key='kredoCustomization:'+(account?.id||'guest');let state={};try{state=JSON.parse(localStorage.getItem(key)||'{}')}catch(e){}
function openRoom(title,arr){document.getElementById('panelHead').textContent=title;const box=document.getElementById('choices');box.innerHTML=arr.map(x=>'<button class="choice" data-v="'+encodeURIComponent(x)+'">'+x+'</button>').join('');box.querySelectorAll('.choice').forEach(b=>b.onclick=()=>selectRoom(b,decodeURIComponent(b.dataset.v)));document.getElementById('panel').classList.add('open')}
function selectRoom(btn,v){document.querySelectorAll('.choice').forEach(x=>x.classList.remove('sel'));btn.classList.add('sel');state.roomLastChoice=v}
function saveRoom(){localStorage.setItem(key,JSON.stringify({...state,roomSaved:true}));document.getElementById('panelHead').textContent='保存しました';document.getElementById('choices').innerHTML='<span style="font-size:9px;color:#367947">マイルーム設定を保存しました。</span>';document.getElementById('panel').classList.add('open')}
</script></div></body></html>
