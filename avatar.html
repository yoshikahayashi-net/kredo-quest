<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>抱月クレドクエスト｜アバター</title><style>body{margin:0;background:#e8f7fc;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP","Yu Gothic",sans-serif}.app{width:min(100%,460px);margin:auto;min-height:100vh;background:#fff}.top{height:54px;background:#168bcB;color:#fff;display:flex;align-items:center;padding:0 10px;gap:8px}.top button{border:0;background:#ffffff20;color:#fff;border-radius:9px;width:34px;height:34px;font-size:17px}.top strong{font-size:15px}.wrap{padding:8px 8px 18px}.refcard{position:relative;width:100%;border-radius:16px;overflow:hidden;border:1px solid #cfe3ed;background:#fff}.refimg{width:100%;aspect-ratio:600/487;background-image:url('reference_ui.jpg?v=42');background-repeat:no-repeat;background-position:left top;background-size:164% auto}.roomimg{aspect-ratio:384/487;background-position:right top;background-size:256% auto}.hot{position:absolute;border:0;background:transparent;cursor:pointer}.hot:focus{outline:2px solid #3aaef0}.panel{display:none;margin-top:8px;background:#fff;border:1px solid #cfe3ed;border-radius:14px;padding:10px}.panel.open{display:block}.panelhead{font-size:11px;font-weight:900;color:#173244}.choices{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}.choice{border:1px solid #cfe3ed;background:#f7fcfe;border-radius:10px;padding:8px 10px;font-size:9px;font-weight:900;color:#31556a}.choice.sel{border-color:#168bcB;background:#eaf8fd;color:#0d6da6}.save{width:100%;height:42px;margin-top:9px;border:0;border-radius:11px;background:#168bcB;color:#fff;font-weight:900}.note{font-size:8px;color:#6b8090;text-align:center;padding-top:7px}</style></head><body><div class="app"><div class="top"><button onclick="location.href='index.html?v=42'">‹</button><strong>アバターをカスタマイズ</strong></div><div class="wrap"><div class="refcard"><div class="refimg" id="ref"></div>
<button class="hot" style="left:14%;top:18%;width:14%;height:28%" aria-label="髪型" onclick="openPanel('髪型',['ショート','ミディアム','ロング','ポニーテール','個性的'])"></button>
<button class="hot" style="left:31%;top:18%;width:14%;height:28%" aria-label="髪色" onclick="openPanel('髪色',['ブラック','ブラウン','アッシュ','ネイビー','ローズ'])"></button>
<button class="hot" style="left:48%;top:18%;width:14%;height:28%" aria-label="顔タイプ" onclick="openPanel('顔タイプ',['タイプA','タイプB','タイプC','タイプD'])"></button>
<button class="hot" style="left:14%;top:44%;width:14%;height:23%" aria-label="服装" onclick="openPanel('服装',['ワーク','カジュアル','きれいめ','スポーティ','個性的'])"></button>
<button class="hot" style="left:31%;top:44%;width:14%;height:23%" aria-label="アクセサリー" onclick="openPanel('アクセサリー',['なし','メガネ','キャップ','ヘッドホン','バッジ'])"></button>
<button class="hot" style="left:48%;top:44%;width:14%;height:23%" aria-label="エフェクト" onclick="openPanel('エフェクト',['なし','キラキラ','リーフ','スター','シールド'])"></button>
<button class="hot" style="left:39%;top:72%;width:27%;height:13%" aria-label="決定" onclick="saveAvatar()"></button>
</div><div class="panel" id="panel"><div class="panelhead" id="panelHead"></div><div class="choices" id="choices"></div><button class="save" onclick="saveAvatar()">この設定を保存</button></div><div class="note">この画面の見た目は、指定された完成イメージをそのまま使用しています。選択操作だけを重ねています。</div></div></div>
<script>
const account=JSON.parse(localStorage.getItem('kredoAccount')||'null');const key='kredoCustomization:'+(account?.id||'guest');let state={};try{state=JSON.parse(localStorage.getItem(key)||'{}')}catch(e){}
function openPanel(title,arr){document.getElementById('panelHead').textContent=title;document.getElementById('choices').innerHTML=arr.map(x=>'<button class="choice" onclick="selectOpt(this,''+x.replaceAll("'","")+"')"'>"+x+"</button>").join('');document.getElementById('panel').classList.add('open')}
function selectOpt(btn,v){document.querySelectorAll('.choice').forEach(x=>x.classList.remove('sel'));btn.classList.add('sel');state.lastChoice=v}
function saveAvatar(){localStorage.setItem(key,JSON.stringify({...state,avatarSaved:true}));document.getElementById('panelHead').textContent='保存しました';document.getElementById('choices').innerHTML='<span style="font-size:9px;color:#367947">アバター設定を保存しました。</span>';document.getElementById('panel').classList.add('open')}
</script></div></body></html>
