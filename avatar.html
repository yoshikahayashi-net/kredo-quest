<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>クレドクエスト｜アバター</title>
<style>
:root{--blue:#168BCB;--dark:#0D6DA6;--sky:#EAF9FE;--line:#CFE3ED;--ink:#173244;--muted:#6B8090;--yellow:#FFD63B}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP","Yu Gothic",sans-serif;background:#E9F7FC;color:var(--ink)}
body{display:flex;justify-content:center}.app{width:min(100%,460px);min-height:100vh;background:linear-gradient(180deg,#E8F8FE,#F8FCFE);box-shadow:0 0 45px rgba(30,86,111,.16)}
.top{height:58px;background:linear-gradient(180deg,#1A90D0,#0B7AB8);color:#fff;display:flex;align-items:center;gap:10px;padding:0 14px}.back{border:0;background:rgba(255,255,255,.16);color:#fff;border-radius:10px;width:34px;height:34px;font-size:18px}.brand{font-weight:900}.wrap{padding:12px 12px 24px}.hero{background:linear-gradient(135deg,#fff,#EAF9FE);border:1px solid var(--line);border-radius:20px;padding:12px;box-shadow:0 9px 24px rgba(18,91,125,.12)}.head{display:flex;align-items:flex-start;gap:8px}.kicker{font-size:9px;color:var(--dark);font-weight:900;letter-spacing:.1em}.title{font-size:21px;font-weight:900;margin-top:2px}.sub{font-size:10px;line-height:1.5;color:var(--muted);margin-top:3px}.badge{margin-left:auto;width:38px;height:38px;border-radius:12px;background:#E8F7FC;border:1px solid #B9DDEA;display:grid;place-items:center;color:var(--dark);font-size:19px}.workspace{display:grid;grid-template-columns:118px 1fr;gap:9px;margin-top:11px}.preview{min-height:345px;border:1px solid #B8D9E6;border-radius:18px;background:linear-gradient(180deg,#F5FCFE,#DDF3FA);position:relative;display:grid;place-items:center;overflow:hidden}.preview:after{content:"";position:absolute;left:10px;right:10px;bottom:11px;height:42px;border-radius:50%;background:rgba(50,120,150,.12);filter:blur(7px)}#preview{position:relative;z-index:2;width:108px;height:215px}.rail{display:grid;grid-template-columns:1fr 1fr;gap:7px;align-content:start}.cat{min-height:66px;border:1px solid var(--line);border-radius:12px;background:#fff;color:#577080;font-size:9px;font-weight:900;display:grid;place-items:center;gap:2px}.cat.active{background:var(--dark);border-color:var(--dark);color:#fff}.cat b{font-size:19px}.panel{margin-top:9px;background:#fff;border:1px solid var(--line);border-radius:15px;padding:9px}.panel-head{display:flex;justify-content:space-between;align-items:center;font-size:10px;font-weight:900}.hint{font-size:8px;color:var(--muted)}.options{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:8px}.opt{border:1px solid var(--line);background:#fff;border-radius:11px;padding:5px;min-height:88px;text-align:center}.opt.active{border-color:#42A9D3;box-shadow:0 0 0 2px rgba(66,169,211,.13);background:#F7FCFE}.thumb{height:56px;border-radius:8px;background:linear-gradient(#F3FBFE,#E8F7FC);display:grid;place-items:center;overflow:hidden}.thumb svg{width:58px;height:70px}.name{font-size:8px;font-weight:900;margin-top:4px;color:#496B7A}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.btn{height:43px;border-radius:12px;font-weight:900;border:0}.backbtn{background:#F2F7F9;border:1px solid var(--line);color:#58717F}.save{background:linear-gradient(180deg,#34A9E8,#168BCB);color:#fff}.points{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:9px}.point{border:1px solid var(--line);background:#fff;border-radius:11px;padding:7px;text-align:center}.point small{font-size:8px;color:var(--muted)}.point strong{display:block;font-size:14px;color:var(--dark);margin-top:2px}
@media(max-width:420px){.workspace{grid-template-columns:104px 1fr}.preview{min-height:330px}.options{grid-template-columns:repeat(2,1fr)}}
</style></head><body><div class="app"><div class="top"><button class="back" onclick="location.href='index.html?v=39'">‹</button><div class="brand">抱月クレドクエスト</div></div>
<div class="wrap"><div class="hero"><div class="head"><div><div class="kicker">PLAYER AVATAR</div><div class="title">アバターをカスタマイズ</div><div class="sub">髪型・服装・アクセサリーなどを組み合わせて、自分だけのキャラクターを作ろう！</div></div><div class="badge">✦</div></div>
<div class="workspace"><div><div class="preview"><div id="preview"></div></div><div class="points"><div class="point"><small>累計獲得</small><strong id="life">0 pt</strong></div><div class="point"><small>利用可能</small><strong id="spend">0 pt</strong></div></div></div>
<div class="rail" id="rail"></div></div>
<div class="panel"><div class="panel-head"><span id="panelTitle">髪型</span><span class="hint">タップしてプレビュー</span></div><div class="options" id="options"></div></div>
<div class="actions"><button class="btn backbtn" onclick="location.href='index.html?v=39'">戻る</button><button class="btn save" onclick="save()">決定</button></div></div></div></div>
<script>
const cats=[['hairStyle','💇','髪型'],['hairColor','🎨','髪色'],['outfit','👕','服装'],['accessory','☆','アクセサリー'],['effect','✦','エフェクト']];
const opts={hairStyle:[['short','ショート','💇'],['medium','ミディアム','🧑'],['long','ロング','👩'],['pony','ポニー','👱'],['spiky','ワイルド','✦']],hairColor:[['black','ブラック','#24313B'],['brown','ブラウン','#76513E'],['ash','アッシュ','#8A8496'],['blue','ネイビー','#395A88'],['rose','ローズ','#B86F83']],outfit:[['work','ワーク','#4A90A9'],['casual','カジュアル','#7DA6C4'],['neat','きれいめ','#6B7AA7'],['sporty','スポーティ','#5DBA91'],['pop','ポップ','#D784A4']],accessory:[['none','なし','—'],['glasses','メガネ','👓'],['cap','キャップ','🧢'],['headphone','ヘッドホン','🎧'],['badge','バッジ','🎖']],effect:[['none','なし','○'],['sparkle','キラキラ','✦'],['leaf','リーフ','🍃'],['star','スター','★'],['shield','シールド','🛡']]};
let cfg={hairStyle:'short',hairColor:'black',outfit:'work',accessory:'none',effect:'none'};let cat='hairStyle';
try{const x=JSON.parse(localStorage.getItem('kredoCustomization:guest')||'null');if(x?.avatar)cfg={...cfg,...x.avatar}}catch(e){}
const stateKey='kredoState:'+((JSON.parse(localStorage.getItem('kredoAccount')||'null')||{}).id||'guest')+':';
const pts=Number(localStorage.getItem(stateKey+'totalPoints')||0),spent=Number((JSON.parse(localStorage.getItem('kredoCustomization:'+((JSON.parse(localStorage.getItem('kredoAccount')||'null')||{}).id||'guest'))||'null')||{}).spentPoints||0);document.getElementById('life').textContent=pts+' pt';document.getElementById('spend').textContent=Math.max(0,pts-spent)+' pt';
function svg(a){const hc={black:'#24313B',brown:'#76513E',ash:'#8A8496',blue:'#395A88',rose:'#B86F83'}[a.hairColor]||'#24313B',oc={work:'#4A90A9',casual:'#7DA6C4',neat:'#6B7AA7',sporty:'#5DBA91',pop:'#D784A4'}[a.outfit]||'#4A90A9';let h=a.hairStyle==='long'?'<path d="M45 74c0-43 57-56 88-23 14 15 13 55 1 81-9 20-26 29-50 25-26-4-39-25-39-53V74Z" fill="'+hc+'"/>':a.hairStyle==='pony'?'<circle cx="147" cy="54" r="17" fill="'+hc+'"/><path d="M52 73c0-42 62-54 88-18 8 12 10 35 4 50-10 24-31 30-61 25-21-4-31-21-31-57Z" fill="'+hc+'"/>':a.hairStyle==='spiky'?'<path d="M47 77 55 46 68 58 84 34 96 53 112 30 118 52 139 39 135 72c-22-16-62-15-88 5Z" fill="'+hc+'"/>':a.hairStyle==='medium'?'<path d="M49 68c0-40 60-51 89-20 10 11 12 28 9 48-4 28-24 39-63 34-25-3-35-23-35-62Z" fill="'+hc+'"/>':'<path d="M54 70c0-40 58-52 87-20 9 10 10 25 7 40-6 28-27 38-59 34-25-3-35-22-35-54Z" fill="'+hc+'"/>';let ac=a.accessory==='glasses'?'<rect x="60" y="87" width="27" height="17" rx="8" fill="rgba(255,255,255,.2)" stroke="#365364" stroke-width="3"/><rect x="94" y="87" width="27" height="17" rx="8" fill="rgba(255,255,255,.2)" stroke="#365364" stroke-width="3"/><path d="M87 95h7" stroke="#365364" stroke-width="3"/>':a.accessory==='cap'?'<path d="M47 59c8-25 34-38 58-38 24 0 43 12 51 35-37-8-72-7-108 3Z" fill="#F3FAFD" stroke="#5AA5C5" stroke-width="3"/><path d="M97 57c19-4 40-1 58 5" stroke="#3D7995" stroke-width="5" stroke-linecap="round"/>':a.accessory==='headphone'?'<path d="M49 91V75c0-36 22-57 51-57s51 21 51 57v16" fill="none" stroke="#355D73" stroke-width="8"/><rect x="39" y="84" width="15" height="30" rx="7" fill="#355D73"/><rect x="145" y="84" width="15" height="30" rx="7" fill="#355D73"/>':a.accessory==='badge'?'<circle cx="122" cy="180" r="10" fill="#FFD63B" stroke="#fff" stroke-width="3"/><text x="122" y="184" text-anchor="middle" font-size="8" font-weight="900" fill="#7A5C00">C</text>':'';let ef=a.effect==='sparkle'?'<text x="20" y="56" font-size="26" fill="#FFE25A">✦</text><text x="159" y="133" font-size="20" fill="#FFE25A">✦</text>':a.effect==='leaf'?'<text x="18" y="140" font-size="25">🍃</text><text x="154" y="64" font-size="22">🍃</text>':a.effect==='star'?'<text x="16" y="58" font-size="23" fill="#FFD84D">★</text><text x="160" y="145" font-size="20" fill="#FFD84D">★</text>':a.effect==='shield'?'<path d="M169 128l16 8v14c0 15-9 24-16 29-7-5-16-14-16-29v-14Z" fill="#D3EEF8" stroke="#4A90A9" stroke-width="3"/>':'';return '<svg viewBox="0 0 200 260" width="100%" height="100%">'+ef+'<ellipse cx="100" cy="239" rx="51" ry="10" fill="rgba(33,86,108,.12)"/><path d="M51 176c3-32 20-48 49-48s46 16 49 48v28H51Z" fill="'+oc+'"/><circle cx="100" cy="104" r="45" fill="#FFD8BF"/>'+h+'<circle cx="84" cy="106" r="4.5" fill="#314654"/><circle cx="116" cy="106" r="4.5" fill="#314654"/><path d="M91 121c6 4 12 4 18 0" fill="none" stroke="#A85F59" stroke-width="3" stroke-linecap="round"/>'+ac+'<path d="M62 195h24v28H62Z" fill="#435C69"/><path d="M114 195h24v28H114Z" fill="#435C69"/><rect x="56" y="220" width="35" height="10" rx="5" fill="#2E495A"/><rect x="109" y="220" width="35" height="10" rx="5" fill="#2E495A"/></svg>'}
function draw(){document.getElementById('preview').innerHTML=svg(cfg);document.getElementById('options').innerHTML=(opts[cat]||[]).map(o=>{const active=cfg[cat]===o[0],thumb=cat==='hairColor'?'<span style="width:26px;height:26px;border-radius:50%;background:'+o[2]+';border:2px solid #fff;box-shadow:0 2px 5px rgba(0,0,0,.15);display:inline-block"></span>':svg({...cfg,[cat]:o[0]});return '<button class="opt '+(active?'active':'')+'" onclick="pick(\''+o[0]+'\')"><div class="thumb">'+thumb+'</div><div class="name">'+o[1]+'</div></button>'}).join('');document.getElementById('panelTitle').textContent=cats.find(x=>x[0]===cat)[2]}
function pick(id){cfg[cat]=id;draw()}
document.getElementById('rail').innerHTML=cats.map(x=>'<button class="cat '+(cat===x[0]?'active':'')+'" onclick="setCat(\''+x[0]+'\')"><b>'+x[1]+'</b>'+x[2]+'</button>').join('');
function setCat(id){cat=id;document.querySelectorAll('.cat').forEach(b=>b.classList.toggle('active',b.textContent.includes(cats.find(x=>x[0]===id)[2])));draw()}
function save(){const account=JSON.parse(localStorage.getItem('kredoAccount')||'null');const key='kredoCustomization:'+(account?.id||'guest');let all={avatar:cfg,roomTheme:'basic',roomWallpaper:'basic',roomFloor:'wood',roomItems:['desk','chair','plant'],ownedItems:{skins:[],furniture:['desk','chair','plant']},spentPoints:0};try{all={...all,...(JSON.parse(localStorage.getItem(key)||'null')||{}),avatar:cfg}}catch(e){}localStorage.setItem(key,JSON.stringify(all));location.href='index.html?v=39'}
draw();
</script></div></body></html>
